---
- name: Include roles for qui qBittorrent integration Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for qui qBittorrent integration Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-qbittorrent
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

    # This is the command docs/configuring-qui.md gives for creating the qui
    # account on the server, before the service is ever reachable - the way to
    # avoid racing anybody for a freshly installed instance. It runs here exactly
    # when the documentation says to run it: after the role has installed qui,
    # but before qui has been started. The command creates qui's database, so
    # the database existing is also what keeps it from running a second time.
    - name: Create the qui account before qui is started, as the documentation describes
      ansible.builtin.command:
        cmd: >-
          docker run --rm -i
          --user={{ qui_uid }}:{{ qui_gid }}
          --mount type=bind,src={{ qui_data_path }},dst=/config
          {{ qui_container_image }}
          create-user --username {{ qui_molecule_admin_username }}
        stdin: "{{ qui_molecule_admin_password }}"
        creates: "{{ qui_data_path }}/qui.db"

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure qBittorrent systemd service is started
      ansible.builtin.systemd_service:
        name: qbittorrent.service
        state: started

    - name: Ensure qui systemd service is started
      ansible.builtin.systemd_service:
        name: qui.service
        state: started
