---
- name: Verify qui
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Where the role published qui (`qui_container_http_host_bind_port`), and where
    # qui serves itself under that (`qui_path_prefix`, handed to it as its base URL).
    qui_verify_url: "http://127.0.0.1:{{ qui_container_http_port }}"
    qui_verify_base_url: "{{ qui_verify_url }}{{ qui_path_prefix }}"

    # The name carries both the role and the scenario, like the platform does, so
    # a leftover container can never be mistaken for another scenario's.
    qui_verify_stock_container: "{{ inventory_hostname }}-stock-control"

    # A host port that the role's own binding does not use, for the control
    # container only. qui's unconfigured self listens on 7476 inside.
    qui_verify_stock_port: 7475

    # The API key the round trip creates. Distinctive enough that finding it in the
    # SQLite file cannot be a coincidence.
    qui_verify_api_key_name: molecule-round-trip-key

    # The health-check command the role hands Docker in place of the image's own.
    qui_verify_health_command: "wget --no-verbose --tries=1 --spider http://127.0.0.1:{{ qui_container_http_port }}/health || exit 1"

    qui_verify_units:
      - qui.service

  tasks:
    - name: Verify that qui works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: qui_defaults

        # ------------------------------------------------------------------
        # The unit is up and qui itself is answering
        # ------------------------------------------------------------------

        - name: Wait for the qui systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: qui_services
          until: qui_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ qui_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the qui systemd services are active
          ansible.builtin.assert:
            that: qui_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(qui_verify_units | zip(qui_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the qui systemd services log for debugging
          when: qui_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ qui_verify_units }}"

        # `active` only says a docker client is running. qui mounts its health
        # endpoint at the root of its listener whatever its base URL, and only once
        # it has migrated its database and opened that listener.
        - name: Wait for qui to report itself healthy (up to 180s)
          ansible.builtin.uri:
            url: "{{ qui_verify_url }}/health"
            status_code: [200]
          register: qui_health
          until: qui_health.status | default(0) == 200
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # wall of connection errors.
          failed_when: false

        - name: Assert qui reports itself healthy
          ansible.builtin.assert:
            that: qui_health.json.status | default('') == 'ok'
            fail_msg: "qui did not report itself healthy: {{ qui_health.json | default(qui_health.msg | default('no response')) }}"
            success_msg: "qui reports itself healthy"

        # Traefik does not route to a container which Docker does not consider
        # healthy, so Docker's verdict matters on its own - and it is reached through
        # the health-check command, not through anything asked above. The unit's
        # health interval is 30s without Traefik, so the first verdict can take that
        # long to arrive.
        - name: Wait for Docker to consider the qui container healthy (up to 180s)
          ansible.builtin.command:
            cmd: "docker container inspect {{ qui_molecule_container }}"
          register: qui_docker_health_raw
          until: (qui_docker_health_raw.stdout | from_json)[0].State.Health.Status | default('') == 'healthy'
          retries: 36
          delay: 5
          changed_when: false
          failed_when: false

        - name: Keep Docker's verdict on the qui container
          ansible.builtin.set_fact:
            qui_docker_health: "{{ (qui_docker_health_raw.stdout | from_json)[0].State.Health.Status | default('unknown') }}"

        - name: Inspect qui container
          ansible.builtin.command:
            cmd: "docker container inspect {{ qui_molecule_container }}"
          register: qui_container_raw
          changed_when: false

        - name: Assert exactly one qui container is there to inspect
          ansible.builtin.assert:
            that: (qui_container_raw.stdout | from_json) | length == 1
            fail_msg: >-
              `docker container inspect {{ qui_molecule_container }}` described
              {{ (qui_container_raw.stdout | from_json) | length }} containers, so the
              role's container is not there to be read
            success_msg: "The role's {{ qui_molecule_container }} container is there"

        - name: Parse the qui container definition
          ansible.builtin.set_fact:
            qui_container: "{{ (qui_container_raw.stdout | from_json)[0] }}"

        - name: Read the qui image the role pulled
          ansible.builtin.command:
            cmd: "docker image inspect {{ qui_container.Config.Image }}"
          register: qui_image_raw
          changed_when: false

        - name: Parse the qui image definition
          ansible.builtin.set_fact:
            qui_image: "{{ (qui_image_raw.stdout | from_json)[0] }}"

        # ------------------------------------------------------------------
        # The negative control: the same image, without the role's doing
        # ------------------------------------------------------------------

        # With the role's qui answering, this is what says the answers mean anything.
        # qui is not an application that falls over when it is unconfigured. Left
        # entirely alone it writes itself a config.toml, migrates a fresh SQLite file
        # and serves a web UI indistinguishable from the role's - so "qui answers" is
        # worth nothing here on its own, and every claim below has to rest on a value
        # this control shows qui does not choose for itself.
        - name: Run the qui image with none of the role's configuration
          ansible.builtin.command:
            cmd: >-
              docker run -d --rm
              --name {{ qui_verify_stock_container }}
              -p 127.0.0.1:{{ qui_verify_stock_port }}:7476
              {{ qui_container.Config.Image }}
          changed_when: true

        - name: Run the negative control with the control container cleaned up afterwards
          block:
            - name: Wait for the unconfigured qui to become healthy (up to 3m)
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ qui_verify_stock_port }}/health"
                status_code: [200]
              register: qui_stock_health
              until: qui_stock_health.status | default(0) == 200
              retries: 36
              delay: 5

            # The land grab, demonstrated at the image level: a qui nobody has set up
            # hands its only account to whoever asks first, with no credential at all.
            # The role's own instance is checked for the same thing further down, and
            # this is what says the behavior comes with qui rather than with anything
            # the role does.
            - name: Ask the unconfigured qui whether it can still be claimed
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ qui_verify_stock_port }}/api/auth/check-setup"
                status_code: [200]
              register: qui_stock_check_setup

            - name: Claim the unconfigured qui without presenting any credential
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ qui_verify_stock_port }}/api/auth/setup"
                method: POST
                body_format: json
                body:
                  username: "{{ qui_molecule_admin_username }}"
                  password: "{{ qui_molecule_admin_password }}"
                status_code: [201]
              register: qui_stock_setup

            - name: Ask the unconfigured qui what it configured for itself
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ qui_verify_stock_port }}/api/application/info"
                headers:
                  Cookie: "{{ qui_stock_setup.set_cookie | default('') | regex_search('qui_user_session=[^;]+') }}"
                status_code: [200]
              register: qui_stock_info

            - name: Ask the unconfigured qui for its web UI at the root
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ qui_verify_stock_port }}/"
                follow_redirects: none
                status_code: [200]
                return_content: true
              register: qui_stock_root

            - name: Read the unconfigured qui's own log
              ansible.builtin.command:
                cmd: "docker logs {{ qui_verify_stock_container }}"
              register: qui_stock_log
              changed_when: false

            - name: Assert the unconfigured qui picks none of the values this scenario pins
              ansible.builtin.assert:
                that:
                  - qui_stock_check_setup.json.setupRequired
                  - qui_stock_info.json.port == 7476
                  - qui_stock_info.json.baseUrl == '/'
                  - qui_stock_info.json.checkForUpdates
                  - "'<title>qui</title>' in qui_stock_root.content"
                  - "'Secure' not in (qui_stock_setup.set_cookie | default(''))"
                  - "'Path=/;' in (qui_stock_setup.set_cookie | default(''))"
                  - "'Database directory ensured' in (qui_stock_log.stdout ~ qui_stock_log.stderr)"
                  - "':7476/health' in qui_image.Config.Healthcheck.Test | join(' ')"
                  - qui_container_http_port != 7476
                fail_msg: >-
                  Left to itself the qui image reports port {{ qui_stock_info.json.port }},
                  base URL {{ qui_stock_info.json.baseUrl }}, update checks
                  {{ qui_stock_info.json.checkForUpdates }} and the session cookie
                  "{{ qui_stock_setup.set_cookie | default('') }}". Those are the values this
                  scenario uses as evidence of the role's configuration, so they can no longer
                  be credited to it.
                success_msg: >-
                  Left to itself the qui image chooses port 7476, base URL `/`, update checks on,
                  DEBUG logging and a session cookie without `Secure`, probes 7476 for its health,
                  and offers its only account to any anonymous caller - so the opposite of each,
                  below, is the role's doing

          always:
            - name: Remove the unconfigured qui
              ansible.builtin.command:
                cmd: "docker rm --force {{ qui_verify_stock_container }}"
              changed_when: true

        # ------------------------------------------------------------------
        # The container is the one the role describes
        # ------------------------------------------------------------------

        # The image's own health-check probes 7476, where nothing listens in this
        # scenario - the control above showed it. Docker calling the container
        # healthy is therefore the role's health-check command at work.
        - name: Assert Docker health-checks qui where it actually listens
          ansible.builtin.assert:
            that:
              - qui_docker_health == 'healthy'
              - qui_container.Config.Healthcheck.Test == ['CMD-SHELL', qui_verify_health_command]
            fail_msg: >-
              Docker considers the container {{ qui_docker_health }}, health-checking it
              with {{ qui_container.Config.Healthcheck.Test | default('nothing') }}
            success_msg: >-
              Docker considers the container healthy, health-checking it on port
              {{ qui_container_http_port }} rather than on the image's 7476

        - name: Assert the container runs the way the role describes it
          ansible.builtin.assert:
            that:
              - qui_container.Config.User == (qui_uid ~ ':' ~ qui_gid)
              - qui_container.HostConfig.ReadonlyRootfs
              - qui_container.HostConfig.CapDrop == ['ALL']
              - "'/tmp' in qui_container.HostConfig.Tmpfs"
              - ('QUI__PORT=' ~ qui_container_http_port) in qui_container.Config.Env
              - ('QUI__BASE_URL=' ~ qui_path_prefix) in qui_container.Config.Env
              - (qui_container_http_port ~ '/tcp') in qui_container.NetworkSettings.Ports
              - qui_molecule_network in qui_container.NetworkSettings.Networks
            fail_msg: >-
              The container runs as {{ qui_container.Config.User }} with a
              {{ 'read-only' if qui_container.HostConfig.ReadonlyRootfs else 'writable' }} root filesystem,
              capabilities dropped {{ qui_container.HostConfig.CapDrop }}, tmpfs {{ qui_container.HostConfig.Tmpfs }},
              publishing {{ qui_container.NetworkSettings.Ports.keys() | list }} on networks
              {{ qui_container.NetworkSettings.Networks.keys() | list }}
            success_msg: >-
              The container runs as {{ qui_container.Config.User }}, read-only with every capability
              dropped and a tmpfs /tmp, publishes {{ qui_container_http_port }}/tcp and hands qui
              QUI__PORT={{ qui_container_http_port }} and QUI__BASE_URL={{ qui_path_prefix }}

        # ------------------------------------------------------------------
        # The instance is unclaimed, and setup closes behind us
        # ------------------------------------------------------------------

        # This is the state a freshly installed instance is left in, and the reason
        # docs/configuring-qui.md tells operators to create their account at once (or
        # before starting the service): the call below needs no credential whatsoever.
        - name: Ask qui whether it can still be claimed
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/check-setup"
            status_code: [200]
          register: qui_setup_open

        # Until then, qui serves nothing else out of its API - not even a refusal
        # that would depend on credentials.
        - name: Ask qui for its instances before it has been set up
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/instances"
            status_code: [428]
          register: qui_unclaimed_instances

        - name: Claim the qui the role installed
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/setup"
            method: POST
            body_format: json
            body:
              username: "{{ qui_molecule_admin_username }}"
              password: "{{ qui_molecule_admin_password }}"
            status_code: [201]
          register: qui_setup

        - name: Ask qui whether it can still be claimed a second time
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/check-setup"
            status_code: [200]
          register: qui_setup_closed

        - name: Try to claim the qui the role installed a second time
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/setup"
            method: POST
            body_format: json
            body:
              username: not-{{ qui_molecule_admin_username }}
              password: not-{{ qui_molecule_admin_password }}
            status_code: [400]
          register: qui_setup_again

        - name: Assert qui can be set up exactly once
          ansible.builtin.assert:
            that:
              - qui_setup_open.json.setupRequired
              - qui_unclaimed_instances.json.setup_required
              - qui_setup.json.user.username == qui_molecule_admin_username
              - not qui_setup_closed.json.setupRequired
              - qui_setup_again.json.error == 'Setup already completed'
            fail_msg: >-
              Setup did not behave as documented: before={{ qui_setup_open.json | default('no response') }},
              create={{ qui_setup.json | default('no response') }},
              afterwards={{ qui_setup_closed.json | default('no response') }},
              again={{ qui_setup_again.json | default('no response') }}
            success_msg: >-
              A freshly installed qui serves nothing but its setup (428), accepts an
              unauthenticated setup call, creates the account, and then refuses further ones

        # ------------------------------------------------------------------
        # Everything without a credential is turned away
        # ------------------------------------------------------------------

        - name: Ask qui for its instances without credentials
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/instances"
            status_code: [403]
          register: qui_anonymous_instances

        - name: Ask qui for its instances with a session that was never issued
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/instances"
            headers:
              Cookie: qui_user_session=deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdea
            status_code: [403]
          register: qui_forged_session

        # qui answers a missing credential with 403 and a rejected API key with 401.
        # Checking both says the refusals above are decisions the auth middleware
        # makes, rather than a blanket rejection that would look the same if the API
        # were not mounted at all.
        - name: Ask qui for its instances with an API key that was never issued
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/instances"
            headers:
              X-API-Key: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
            status_code: [401]
          register: qui_forged_api_key

        # The qBittorrent proxy that Sonarr, Radarr and others are pointed at sits
        # outside the API's authentication and has a key of its own instead.
        - name: Ask qui's qBittorrent proxy for qBittorrent's version with a client key that was never issued
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/proxy/deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef/api/v2/app/version"
            status_code: [401]
          register: qui_forged_proxy_key

        - name: Assert qui turns away everyone who cannot prove who they are
          ansible.builtin.assert:
            that:
              - qui_anonymous_instances.status == 403
              - qui_forged_session.status == 403
              - qui_forged_api_key.status == 401
              - qui_forged_proxy_key.status == 401
            fail_msg: >-
              qui let something through: anonymous={{ qui_anonymous_instances.status }},
              forged session={{ qui_forged_session.status }},
              forged API key={{ qui_forged_api_key.status }},
              forged proxy key={{ qui_forged_proxy_key.status }}
            success_msg: >-
              qui refuses anonymous calls and forged sessions with 403, and forged API keys and
              qBittorrent proxy keys with 401, so everything read below had to be authenticated for

        # ------------------------------------------------------------------
        # qui serves itself under the base URL, and only there
        # ------------------------------------------------------------------

        # qui's web UI is a single-page application that answers its own shell on
        # any path under the base URL, so a 200 there is no evidence of anything in
        # particular. What is evidence is the root: the control above serves its UI
        # there, while a qui that took the base URL on board refuses it.
        - name: Ask qui for its web UI at the root
          ansible.builtin.uri:
            url: "{{ qui_verify_url }}/"
            follow_redirects: none
            status_code: [404]
            return_content: true
          register: qui_root

        - name: Ask qui for its web UI under the base URL
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/"
            follow_redirects: none
            status_code: [200]
            return_content: true
          register: qui_web_ui

        - name: Ask qui for an API endpoint that does not exist
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/molecule-no-such-endpoint"
            status_code: [404]
          register: qui_bogus_endpoint

        - name: Assert qui serves itself under the base URL the role configured
          ansible.builtin.assert:
            that:
              - qui_root.status == 404
              - "('Must use baseUrl: ' ~ qui_path_prefix ~ '/') in qui_root.content"
              - qui_web_ui.status == 200
              - "'<title>qui</title>' in qui_web_ui.content"
              - qui_bogus_endpoint.status == 404
            fail_msg: >-
              qui answered {{ qui_root.status }} ("{{ qui_root.content | default('') | truncate(100) }}") at
              the root and {{ qui_web_ui.status }} under {{ qui_path_prefix }}/
            success_msg: >-
              qui serves its web UI under {{ qui_path_prefix }}/ and refuses the root with
              "{{ qui_root.content | trim }}", where the unconfigured control served its UI

        - name: Log in to qui with the wrong password
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/login"
            method: POST
            body_format: json
            body:
              username: "{{ qui_molecule_admin_username }}"
              password: not-{{ qui_molecule_admin_password }}
            status_code: [401]
          register: qui_bad_login

        - name: Log in to qui
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/auth/login"
            method: POST
            body_format: json
            body:
              username: "{{ qui_molecule_admin_username }}"
              password: "{{ qui_molecule_admin_password }}"
            status_code: [200]
          register: qui_login

        - name: Keep the qui session cookie
          ansible.builtin.set_fact:
            qui_session: "{{ qui_login.set_cookie | default('') | regex_search('qui_user_session=[^;]+') }}"

        # The session cookie carries the base URL as its path and, unlike the
        # control's, the `Secure` attribute - which only `QUI__SESSION_COOKIE_SECURE`
        # from the role's env file could have added.
        - name: Assert qui issued a session only to the right password, the way the role configured it
          ansible.builtin.assert:
            that:
              - qui_bad_login.status == 401
              - "'qui_user_session=' not in (qui_bad_login.set_cookie | default(''))"
              - qui_session | length > 24
              - ('Path=' ~ qui_path_prefix ~ '/;') in qui_login.set_cookie
              - "'Secure' in qui_login.set_cookie"
            fail_msg: >-
              qui answered {{ qui_bad_login.status }} to the wrong password
              (cookie {{ qui_bad_login.set_cookie | default('none') }}) and issued
              "{{ qui_login.set_cookie | default('none') }}" to the right one
            success_msg: >-
              qui refuses the wrong password with 401 and no cookie, and issues
              {{ qui_molecule_admin_username }} a `Secure` session cookie scoped to {{ qui_path_prefix }}/

        # ------------------------------------------------------------------
        # The running process is the version this role pins, configured by the role
        # ------------------------------------------------------------------

        - name: Ask qui about itself
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/application/info"
            headers:
              Cookie: "{{ qui_session }}"
            status_code: [200]
          register: qui_info

        # /api/application/info reports the version linked into the running binary
        # and does no network I/O to work it out.
        - name: Assert the running qui is the version this role installs
          ansible.builtin.assert:
            that:
              - qui_info.json.version == qui_defaults.qui_version
              - (qui_container.Config.Image | split(':') | last) == qui_defaults.qui_version
              - qui_image.Config.Labels['org.opencontainers.image.version'] == qui_defaults.qui_version
            fail_msg: "qui reports {{ qui_info.json.version | default('none') }}, expected {{ qui_defaults.qui_version }}"
            success_msg: "qui reports {{ qui_info.json.version }}"

        # Every one of these is a value qui picks differently when it is left alone -
        # the control container above showed 7476, `/` and update checks on. None of
        # them is written into the config.toml qui generates for itself; the only
        # route they have is the env file this role renders and hands to the
        # container, so qui reporting them is that file arriving at the process.
        - name: Assert qui is running the configuration the role rendered
          ansible.builtin.assert:
            that:
              - qui_info.json.port == qui_container_http_port
              - qui_info.json.host == '0.0.0.0'
              - qui_info.json.baseUrl == qui_path_prefix ~ '/'
              - not qui_info.json.checkForUpdates
              - qui_info.json.configDir == '/config'
              - qui_info.json.dataDir == '/config'
              - qui_info.json.database.engine == 'sqlite'
              - qui_info.json.database.target == '/config/qui.db'
              - qui_info.json.authMode == 'builtin'
            fail_msg: >-
              qui is running with {{ qui_info.json | string | truncate(400) }}, which is not what the
              role's env file says
            success_msg: >-
              qui listens on {{ qui_info.json.port }} rather than its own default of 7476, serves
              under {{ qui_info.json.baseUrl }} and has update checks off, because the role's
              rendered env file reached the process

        # qui timestamps its own log lines in local time. Etc/UTC - the role's
        # default, which this scenario deliberately does not use - renders them with a
        # trailing `Z`, so an offset is TZ having reached the process rather than
        # merely the env file. The control logged at DEBUG, so a DEBUG-only line
        # missing here is QUI__LOG_LEVEL having reached it as well.
        #
        # The journal is read scoped to the invocation that is running now, because
        # it also keeps every earlier start of the unit, and a check that accepted
        # those would still pass after the configuration had been changed and the
        # service restarted.
        - name: Ask systemd which invocation of qui is running
          ansible.builtin.systemd_service:
            name: qui.service
          register: qui_invocation

        - name: Read qui's own log lines out of the journal
          ansible.builtin.command:
            cmd: journalctl _SYSTEMD_INVOCATION_ID={{ qui_invocation.status.InvocationID }} --no-pager --output cat
          register: qui_journal
          changed_when: false

        - name: Assert qui logs in the timezone and at the level the role configured
          ansible.builtin.assert:
            that:
              - qui_journal.stdout is search('"time":"[0-9T:-]+\+0[23]:00"')
              - qui_journal.stdout is search('Starting qui')
              - "'Database directory ensured' not in qui_journal.stdout"
              - qui_environment_variables_tz != 'Etc/UTC'
            fail_msg: >-
              qui's log lines carry no {{ qui_environment_variables_tz }} offset or still carry
              DEBUG lines, so `qui_environment_variables_tz` or `QUI__LOG_LEVEL` did not reach
              the process
            success_msg: >-
              qui timestamps its log lines with a {{ qui_environment_variables_tz }} offset rather than
              the trailing Z that the role's default of Etc/UTC would give, and logs no DEBUG lines

        # ------------------------------------------------------------------
        # A round trip through the API, cross-checked in SQLite
        # ------------------------------------------------------------------

        # Cookie-authenticated writes must carry `X-Requested-With`, which is what
        # qui's own web UI sends.
        - name: Ask qui for an API key
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/api-keys"
            method: POST
            headers:
              Cookie: "{{ qui_session }}"
              X-Requested-With: XMLHttpRequest
            body_format: json
            body:
              name: "{{ qui_verify_api_key_name }}"
            status_code: [201]
          register: qui_created_key

        # A second way in, which is also the other half of the 401 asserted earlier:
        # the key qui itself issued is accepted where the invented one was not.
        - name: List the API keys qui holds, with the API key instead of the session
          ansible.builtin.uri:
            url: "{{ qui_verify_base_url }}/api/api-keys"
            headers:
              X-API-Key: "{{ qui_created_key.json.key }}"
            status_code: [200]
          register: qui_listed_keys

        - name: Assert the API key qui issued works where an invented one did not
          ansible.builtin.assert:
            that:
              - qui_created_key.json.key | length >= 32
              - (qui_listed_keys.json | map(attribute='name') | list) == [qui_verify_api_key_name]
            fail_msg: >-
              An API key qui issued did not read itself back
              ({{ qui_listed_keys.json | string | truncate(200) }})
            success_msg: >-
              The API key qui issued lists itself, while the invented key earlier was refused with 401

        # qui's own API could be answering out of anything it holds in memory. This
        # is the check that says the data landed in the SQLite file inside the
        # directory the role bind-mounts from the host - a path qui would never have
        # chosen on its own, as the control container writing into its own container
        # filesystem showed.
        - name: Read qui's database back off the host
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import hashlib, json, sqlite3, sys

                database_path, api_key, username = sys.argv[1:4]
                connection = sqlite3.connect(database_path)

                def scalar(query, *parameters):
                    # A wrong path would hand sqlite3 an empty database rather than
                    # an error, so a missing table has to read as a missing value
                    # and let the assertion that follows be the thing that fails.
                    try:
                        row = connection.execute(query, parameters).fetchone()
                    except sqlite3.OperationalError:
                        return 'MISSING'
                    return 'MISSING' if row is None else str(row[0])

                print(json.dumps({
                    # qui keeps only a SHA-256 of each key, and interns the names.
                    'api_key': scalar(
                        'select string_pool.value from api_keys'
                        ' join string_pool on string_pool.id = api_keys.name_id'
                        ' where api_keys.key_hash = ?',
                        hashlib.sha256(api_key.encode()).hexdigest()),
                    'user': scalar('select username from user where username = ?', username),
                    'migrations': scalar('select count(*) from migrations'),
                }))

                connection.close()
              - "{{ qui_molecule_data_path }}/qui.db"
              - "{{ qui_created_key.json.key }}"
              - "{{ qui_molecule_admin_username }}"
          register: qui_sqlite
          changed_when: false

        - name: Make sense of what the database holds
          ansible.builtin.set_fact:
            qui_sqlite_facts: "{{ qui_sqlite.stdout | from_json }}"

        - name: Assert qui's data is in the SQLite file on the path the role mounts
          ansible.builtin.assert:
            that:
              - qui_sqlite_facts.api_key == qui_verify_api_key_name
              - qui_sqlite_facts.user == qui_molecule_admin_username
              - qui_sqlite_facts.migrations | int > 0
            fail_msg: >-
              {{ qui_molecule_data_path }}/qui.db does not hold what qui claims to have stored:
              {{ qui_sqlite_facts }}
            success_msg: >-
              {{ qui_molecule_data_path }}/qui.db carries qui's schema
              ({{ qui_sqlite_facts.migrations }} applied migrations), the account that was set
              up and the API key issued over the API, found by its hash

        - name: Assert the container is fed that database off the host path the role owns
          ansible.builtin.assert:
            that:
              - >-
                (qui_container.Mounts | selectattr('Destination', 'equalto', '/config')
                 | map(attribute='Source') | list) == [qui_molecule_data_path]
              - qui_container.HostConfig.ReadonlyRootfs
            fail_msg: >-
              The container's /config comes from
              {{ qui_container.Mounts | map(attribute='Source') | list }} and its root
              filesystem is
              {{ 'read-only' if qui_container.HostConfig.ReadonlyRootfs else 'writable' }}
            success_msg: >-
              The container's /config is a bind mount of {{ qui_molecule_data_path }} and its
              root filesystem is read-only, so the rows above could only have been written
              through that mount

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "qui_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: qui_restarts_before
              loop: "{{ qui_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: qui_restarts_after
              loop: "{{ qui_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - qui_restarts_after.results | map(attribute='status.NRestarts') | list == qui_restarts_before.results | map(attribute='status.NRestarts') | list
                  - qui_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in qui_verify_units | zip(qui_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in qui_verify_units | zip(qui_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in qui_verify_units | zip(qui_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the qui verification summary
          ansible.builtin.debug:
            msg:
              - "qui systemd: {% for unit, state in qui_verify_units | zip(qui_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "qui restarts: {% for unit, restarts in qui_verify_units | zip(qui_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "qui version: {{ qui_info.json.version }} from {{ qui_container.Config.Image }}"
              - "qui Docker health: {{ qui_docker_health }} via {{ qui_container.Config.Healthcheck.Test | last }}"
              - "qui unconfigured image: port {{ qui_stock_info.json.port }}, base URL {{ qui_stock_info.json.baseUrl }}, update checks {{ qui_stock_info.json.checkForUpdates }}, claimable {{ qui_stock_check_setup.json.setupRequired }}"
              - "qui refusals: anonymous {{ qui_anonymous_instances.status }}, forged session {{ qui_forged_session.status }}, forged API key {{ qui_forged_api_key.status }}, forged proxy key {{ qui_forged_proxy_key.status }}, wrong password {{ qui_bad_login.status }}, root {{ qui_root.status }}"
              - "qui setup: required {{ qui_setup_open.json.setupRequired }} before, {{ qui_setup_closed.json.setupRequired }} after"
              - "qui configuration: port {{ qui_info.json.port }}, base URL {{ qui_info.json.baseUrl }}, update checks {{ qui_info.json.checkForUpdates }}"
              - "qui sqlite ({{ qui_molecule_data_path }}/qui.db): {{ qui_sqlite_facts }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the qui systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=qui.service
          register: qui_service_log
          changed_when: false

        - name: Show the qui systemd service log
          ansible.builtin.debug:
            var: qui_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "qui verification failed. The systemd service log is printed above."
