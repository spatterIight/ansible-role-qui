---
- name: Check existence of qui systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ qui_identifier }}.service"
  register: qui_service_stat

- name: Uninstall qui systemd services and files
  when: qui_service_stat.stat.exists | bool
  block:
    - name: Ensure qui systemd service is stopped
      ansible.builtin.service:
        name: "{{ qui_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure qui systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ qui_identifier }}.service"
        state: absent

    - name: Ensure qui support files do not exist
      ansible.builtin.file:
        path: "{{ qui_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure qui local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ qui_data_path }}"
      register: qui_data_path_deletion_result
      changed_when: qui_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure qui base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ qui_base_path }}"
      register: qui_base_path_deletion_result
      changed_when: qui_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure qui container network does not exist
      when: qui_container_network_deletion_enabled
      block:
        - name: Ensure qui container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ qui_container_network }}"
            state: absent
          register: qui_network_deletion_result

        - name: Ensure qui container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ qui_container_network }}
          register: qui_network_deletion_result
          changed_when: qui_container_network in qui_network_deletion_result.stdout

- name: Check existence of qui local data path
  ansible.builtin.stat:
    path: "{{ qui_data_path }}"
  register: qui_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Inject the message about the remaining qui local data path
  when: qui_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local qui instance has been removed, some old data remains in `" + qui_data_path + "`. Feel free to delete it."
        ]
      }}
