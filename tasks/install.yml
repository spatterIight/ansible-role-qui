---
- name: Ensure qui paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ qui_uid }}"
    group: "{{ qui_gid }}"
  with_items:
    - "{{ qui_base_path }}"
    - "{{ qui_data_path }}"

- name: Ensure qui support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ qui_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ qui_uid }}"
    group: "{{ qui_gid }}"
  with_items:
    - env
    - labels
  register: qui_support_files_result

- name: Ensure qui container image is pulled via community.docker.docker_image_pull
  when: devture_systemd_docker_base_container_image_pull_method == 'ansible-module'
  community.docker.docker_image_pull:
    name: "{{ qui_container_image }}"
    pull: always
  register: qui_container_image_pull_result_ansible_module
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: qui_container_image_pull_result_ansible_module is not failed

- name: Ensure qui container image is pulled via ansible.builtin.command
  when: devture_systemd_docker_base_container_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ devture_systemd_docker_base_host_command_docker }} pull {{ qui_container_image }}"
  register: qui_container_image_pull_result_command
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: qui_container_image_pull_result_command is not failed
  changed_when: "'Downloaded newer image' in qui_container_image_pull_result_command.stdout"

- name: Ensure qui container network is created via community.docker.docker_network
  when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ qui_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"
  register: qui_network_creation_result

- name: Ensure qui container network is created via ansible.builtin.command
  when: devture_systemd_docker_base_container_network_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ devture_systemd_docker_base_host_command_docker }} network create
      {% if devture_systemd_docker_base_ipv6_enabled %}--ipv6{% endif %}
      {{ devture_systemd_docker_base_container_networks_driver_options_string }}
      {{ qui_container_network }}
  register: qui_network_creation_result
  changed_when: qui_network_creation_result.rc == 0
  failed_when: qui_network_creation_result.rc != 0 and 'already exists' not in qui_network_creation_result.stderr

- name: Ensure qui systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/qui.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/{{ qui_identifier }}.service"
    mode: "0644"
    lstrip_blocks: true
  register: qui_systemd_service_result

- name: Determine whether qui needs a restart
  ansible.builtin.set_fact:
    qui_restart_necessary: >-
      {{
        qui_support_files_result.changed | default(false)
        or qui_systemd_service_result.changed | default(false)
        or qui_container_image_pull_result_ansible_module.changed | default(false)
        or qui_container_image_pull_result_command.changed | default(false)
      }}
